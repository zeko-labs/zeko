name: Publish docker images

on:
  push:
    tags:
    - '*'
  workflow_dispatch:
    inputs:
      docker_tag_prefix:
        description: "Enter the Docker Tag Prefix (e.g v4)"
        required: true
        type: string

env:
  DOCKER_TAG_PREFIX: ${{ github.event.inputs.docker_tag_prefix }}

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build-docker-image:
    name: Build and Publish Docker Image
    runs-on: zeko-gha-runner
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🏷️ Generate Tag
        run: |
          BRANCH_OR_TAG=$(basename ${{ github.ref }})
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PREFIX=${{ env.DOCKER_TAG_PREFIX }}
            SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
            echo "TAG=$PREFIX-$BRANCH_OR_TAG-$SHORT_SHA" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "push" ] && [ -n "${{ github.event.ref }}" ]; then
            echo "TAG=$BRANCH_OR_TAG" >> $GITHUB_ENV
          else
            echo "Invalid event. Exiting..."
            exit 1
          fi
      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: zekolabs
          password: ${{ secrets.DOCKER_PAT }}

      - name: 🔍 Check if Tag already exists
        id: checktag
        uses: tyriis/docker-image-tag-exists@v2.0.1
        with:
          registry: ghcr.io
          repository: zeko-labs/zeko
          tag: ${{ env.TAG }}

      - name: Install Nix
        if: steps.checktag.outputs.tag == 'not found'
        uses: cachix/install-nix-action@v27

      - name: 🛠️ Build Zeko OCI image
        run: nix build .#zeko-image-full
        
      - name: 🚚 Load and Push Zeko docker image
        run: |
          # load built artifact to docker
          IMAGE_TAR=$(readlink -f result)
          IMAGE_NAME="docker.io/${{ github.repository }}/zeko:${{ env.TAG }}"

          # Load tarball into Docker
          docker load < "$IMAGE_TAR"

          # Re-tag with docker.io repo path
          docker tag zeko:latest "$IMAGE_NAME"

          # Push to Docker Hub
          docker push "$IMAGE_NAME"
